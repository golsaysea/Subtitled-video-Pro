name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  APP_NAME: SubtitleComposer
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"

jobs:
  build-windows:
    name: Build Windows x64 release
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Resolve release tag
        run: |
          $tag = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.version }}"
          }
          if (-not ($tag -match '^v[0-9]+\.[0-9]+\.[0-9]+')) {
            throw "Release tag must look like v0.1.0. Received: $tag"
          }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web_tools/package-lock.json

      - name: Install web dependencies
        working-directory: web_tools
        run: npm ci

      - name: Build web tools
        working-directory: web_tools
        run: npm run build

      - name: Validate release inputs
        run: |
          $required = @(
            "settings.example.json",
            "font_registry.json",
            "nlp_dictionary.txt",
            "fonts\open\open_fonts_manifest.json",
            "LICENSE",
            "COPYING",
            "LICENSE.LIST",
            "THIRD_PARTY_NOTICES.md",
            "SECURITY.md",
            "RELEASE_NOTES_TEMPLATE.md",
            "docs\DEPENDENCY_LICENSE_AUDIT.md",
            "docs\SECURITY_ATTESTATION.md",
            "docs\RELEASE_PROCESS.md"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Required release input is missing: $path"
            }
          }
          if (Test-Path -LiteralPath "settings.json") {
            throw "settings.json is local-only and must not be included in a public release checkout."
          }

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt
          $env:PLAYWRIGHT_BROWSERS_PATH = "0"
          python -m playwright install chromium

      - name: Build Windows app
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = "0"
          $pyinstallerArgs = @(
            "--noconfirm",
            "--clean",
            "--windowed",
            "--name", $env:APP_NAME,
            "--icon", "app_logo.ico",
            "--add-data", "app_logo.png;.",
            "--add-data", "app_logo.ico;.",
            "--add-data", "icon.png;.",
            "--add-data", "style_presets.json;.",
            "--add-data", "settings.example.json;.",
            "--add-data", "font_registry.json;.",
            "--add-data", "nlp_dictionary.txt;.",
            "--add-data", "fonts/open;fonts/open",
            "--add-data", "web_tools/dist;web_tools/dist",
            "--collect-all", "PyQt6",
            "--collect-all", "playwright",
            "--hidden-import", "PyQt6.QtWebEngineWidgets",
            "--hidden-import", "PyQt6.QtWebEngineCore",
            "--hidden-import", "PyQt6.QtWebChannel",
            "--hidden-import", "PyQt6.QtMultimedia",
            "--hidden-import", "playwright.sync_api",
            "main.py"
          )
          python -m PyInstaller @pyinstallerArgs

      - name: Package Windows artifact
        run: |
          $releaseDir = Join-Path $PWD "release"
          New-Item -ItemType Directory -Force $releaseDir | Out-Null

          $distApp = Join-Path $PWD "dist\$env:APP_NAME"
          if (-not (Test-Path $distApp)) {
            throw "PyInstaller output not found: $distApp"
          }

          $noticeFiles = @(
            "README.md",
            "LICENSE",
            "COPYING",
            "LICENSE.LIST",
            "THIRD_PARTY_NOTICES.md",
            "SECURITY.md",
            "RELEASE_NOTES_TEMPLATE.md",
            "docs\DEPENDENCY_LICENSE_AUDIT.md",
            "docs\SECURITY_ATTESTATION.md",
            "docs\RELEASE_PROCESS.md"
          )
          foreach ($file in $noticeFiles) {
            if (Test-Path $file) {
              $destination = Join-Path $distApp $file
              New-Item -ItemType Directory -Force (Split-Path -Parent $destination) | Out-Null
              Copy-Item -LiteralPath $file -Destination $destination -Force
            }
          }

          $artifactName = "$env:APP_NAME-$env:RELEASE_TAG-windows-x64.zip"
          $artifactPath = Join-Path $releaseDir $artifactName
          Compress-Archive -Path (Join-Path $distApp "*") -DestinationPath $artifactPath -Force

          $hash = (Get-FileHash -LiteralPath $artifactPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $artifactName" | Set-Content -LiteralPath (Join-Path $releaseDir "checksums-windows-x64.sha256") -Encoding ascii

      - name: Generate Windows artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            release/*.zip
            release/checksums-windows-x64.sha256

      - name: Upload Windows workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows-x64-release
          path: release/*
          if-no-files-found: error

  build-macos:
    name: Build macOS ${{ matrix.arch }} release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    defaults:
      run:
        shell: bash

    steps:
      - name: Resolve release tag
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.version }}"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Release tag must look like v0.1.0. Received: $tag" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web_tools/package-lock.json

      - name: Install web dependencies
        working-directory: web_tools
        run: npm ci

      - name: Build web tools
        working-directory: web_tools
        run: npm run build

      - name: Validate release inputs
        run: |
          required=(
            "settings.example.json"
            "font_registry.json"
            "nlp_dictionary.txt"
            "fonts/open/open_fonts_manifest.json"
            "LICENSE"
            "COPYING"
            "LICENSE.LIST"
            "THIRD_PARTY_NOTICES.md"
            "SECURITY.md"
            "RELEASE_NOTES_TEMPLATE.md"
            "docs/DEPENDENCY_LICENSE_AUDIT.md"
            "docs/SECURITY_ATTESTATION.md"
            "docs/RELEASE_PROCESS.md"
          )
          for path in "${required[@]}"; do
            if [ ! -e "$path" ]; then
              echo "Required release input is missing: $path" >&2
              exit 1
            fi
          done
          if [ -e "settings.json" ]; then
            echo "settings.json is local-only and must not be included in a public release checkout." >&2
            exit 1
          fi

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt
          export PLAYWRIGHT_BROWSERS_PATH=0
          python -m playwright install chromium

      - name: Create macOS app icon
        run: |
          mkdir -p build/app.iconset
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" app_logo.png --out "build/app.iconset/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z "$double" "$double" app_logo.png --out "build/app.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns build/app.iconset -o build/app_logo.icns

      - name: Build macOS app
        run: |
          export PLAYWRIGHT_BROWSERS_PATH=0
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name "$APP_NAME" \
            --icon build/app_logo.icns \
            --add-data "app_logo.png:." \
            --add-data "app_logo.ico:." \
            --add-data "icon.png:." \
            --add-data "style_presets.json:." \
            --add-data "settings.example.json:." \
            --add-data "font_registry.json:." \
            --add-data "nlp_dictionary.txt:." \
            --add-data "fonts/open:fonts/open" \
            --add-data "web_tools/dist:web_tools/dist" \
            --collect-all PyQt6 \
            --collect-all playwright \
            --hidden-import PyQt6.QtWebEngineWidgets \
            --hidden-import PyQt6.QtWebEngineCore \
            --hidden-import PyQt6.QtWebChannel \
            --hidden-import PyQt6.QtMultimedia \
            --hidden-import playwright.sync_api \
            main.py

      - name: Package macOS artifact
        run: |
          release_dir="$PWD/release"
          mkdir -p "$release_dir"

          dist_app="$PWD/dist/${APP_NAME}.app"
          if [ ! -d "$dist_app" ]; then
            echo "PyInstaller output not found: $dist_app" >&2
            exit 1
          fi

          resources="$dist_app/Contents/Resources"
          notice_files=(
            "README.md"
            "LICENSE"
            "COPYING"
            "LICENSE.LIST"
            "THIRD_PARTY_NOTICES.md"
            "SECURITY.md"
            "RELEASE_NOTES_TEMPLATE.md"
            "docs/DEPENDENCY_LICENSE_AUDIT.md"
            "docs/SECURITY_ATTESTATION.md"
            "docs/RELEASE_PROCESS.md"
          )
          for file in "${notice_files[@]}"; do
            if [ -f "$file" ]; then
              mkdir -p "$resources/$(dirname "$file")"
              cp "$file" "$resources/$file"
            fi
          done

          codesign --force --deep --sign - "$dist_app"

          artifact_name="${APP_NAME}-${RELEASE_TAG}-macos-${{ matrix.arch }}.zip"
          artifact_path="$release_dir/$artifact_name"
          ditto -c -k --sequesterRsrc --keepParent "$dist_app" "$artifact_path"

          hash="$(shasum -a 256 "$artifact_path" | awk '{print $1}')"
          printf "%s  %s\n" "$hash" "$artifact_name" > "$release_dir/checksums-macos-${{ matrix.arch }}.sha256"

      - name: Generate macOS artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            release/*.zip
            release/checksums-macos-${{ matrix.arch }}.sha256

      - name: Upload macOS workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: macos-${{ matrix.arch }}-release
          path: release/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-macos
    defaults:
      run:
        shell: bash

    steps:
      - name: Resolve release tag
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.version }}"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Release tag must look like v0.1.0. Received: $tag" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Download platform artifacts
        uses: actions/download-artifact@v6
        with:
          path: release
          merge-multiple: true

      - name: Create combined checksum and notes
        run: |
          cd release
          sha256sum *.zip > checksums.sha256
          cat > RELEASE_NOTES.md <<EOF
          # Subtitle Composer ${RELEASE_TAG}

          Platform builds generated by GitHub Actions:
          - Windows x64
          - macOS x64 (Intel)
          - macOS arm64 (Apple Silicon)

          Included release evidence:
          - checksums.sha256
          - per-platform checksum files
          - GitHub artifact attestations generated by actions/attest
          - LICENSE.LIST
          - THIRD_PARTY_NOTICES.md
          - docs/DEPENDENCY_LICENSE_AUDIT.md
          - docs/SECURITY_ATTESTATION.md

          Bundled release assets:
          - open font pack under fonts/open
          - font registry font_registry.json
          - NLP dictionary nlp_dictionary.txt

          License baseline: GPL-3.0-only, unless a commercial PyQt/PyQt-WebEngine license is documented.
          EOF

      - name: Generate combined release attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            release/*.zip
            release/checksums.sha256

      - name: Upload combined workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: all-platforms-release
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=()
          while IFS= read -r -d '' file; do
            if [ "$(basename "$file")" != "RELEASE_NOTES.md" ]; then
              files+=("$file")
            fi
          done < <(find release -maxdepth 1 -type f -print0)

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
            gh release edit "$RELEASE_TAG" --notes-file "release/RELEASE_NOTES.md"
          else
            gh release create "$RELEASE_TAG" "${files[@]}" --target "$GITHUB_SHA" --title "Subtitle Composer $RELEASE_TAG" --notes-file "release/RELEASE_NOTES.md"
          fi
