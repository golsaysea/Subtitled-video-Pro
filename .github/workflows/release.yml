name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  APP_NAME: SubtitleComposer
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"

jobs:
  build-windows:
    name: Build Windows release
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Resolve release tag
        run: |
          $tag = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.version }}"
          }
          if (-not ($tag -match '^v[0-9]+\.[0-9]+\.[0-9]+')) {
            throw "Release tag must look like v0.1.0. Received: $tag"
          }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install web dependencies
        working-directory: web_tools
        run: npm install

      - name: Build web tools
        working-directory: web_tools
        run: npm run build

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt
          $env:PLAYWRIGHT_BROWSERS_PATH = "0"
          python -m playwright install chromium

      - name: Build Windows app
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = "0"
          $pyinstallerArgs = @(
            "--noconfirm",
            "--clean",
            "--windowed",
            "--name", $env:APP_NAME,
            "--icon", "app_logo.ico",
            "--add-data", "app_logo.png;.",
            "--add-data", "app_logo.ico;.",
            "--add-data", "icon.png;.",
            "--add-data", "style_presets.json;.",
            "--add-data", "web_tools/dist;web_tools/dist",
            "--collect-all", "PyQt6",
            "--collect-all", "playwright",
            "--hidden-import", "PyQt6.QtWebEngineWidgets",
            "--hidden-import", "PyQt6.QtWebEngineCore",
            "--hidden-import", "PyQt6.QtWebChannel",
            "--hidden-import", "PyQt6.QtMultimedia",
            "--hidden-import", "playwright.sync_api",
            "main.py"
          )
          python -m PyInstaller @pyinstallerArgs

      - name: Package release artifact
        run: |
          $releaseDir = Join-Path $PWD "release"
          New-Item -ItemType Directory -Force $releaseDir | Out-Null

          $distApp = Join-Path $PWD "dist\$env:APP_NAME"
          if (-not (Test-Path $distApp)) {
            throw "PyInstaller output not found: $distApp"
          }

          $noticeFiles = @(
            "README.md",
            "LICENSE",
            "COPYING",
            "LICENSE.LIST",
            "THIRD_PARTY_NOTICES.md",
            "docs\DEPENDENCY_LICENSE_AUDIT.md",
            "docs\SECURITY_ATTESTATION.md",
            "docs\RELEASE_PROCESS.md"
          )
          foreach ($file in $noticeFiles) {
            if (Test-Path $file) {
              Copy-Item -LiteralPath $file -Destination $distApp -Force
            }
          }

          $artifactName = "$env:APP_NAME-$env:RELEASE_TAG-windows-x64.zip"
          $artifactPath = Join-Path $releaseDir $artifactName
          Compress-Archive -Path (Join-Path $distApp "*") -DestinationPath $artifactPath -Force

          Get-ChildItem -LiteralPath $releaseDir -Filter "*.zip" | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -LiteralPath (Join-Path $releaseDir "checksums.sha256") -Encoding ascii

          @"
          # Subtitle Composer $env:RELEASE_TAG

          Windows x64 build generated by GitHub Actions.

          Included release evidence:
          - `checksums.sha256`
          - GitHub artifact attestation generated by `actions/attest`
          - `LICENSE.LIST`
          - `docs/DEPENDENCY_LICENSE_AUDIT.md`
          - `docs/SECURITY_ATTESTATION.md`

          License baseline: GPL-3.0-only, unless a commercial PyQt/PyQt-WebEngine license is documented.
          "@ | Set-Content -LiteralPath (Join-Path $releaseDir "RELEASE_NOTES.md") -Encoding utf8

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            release/*.zip
            release/checksums.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APP_NAME }}-${{ env.RELEASE_TAG }}-windows-x64
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem -LiteralPath "release" -File |
            Where-Object { $_.Name -ne "RELEASE_NOTES.md" } |
            ForEach-Object { $_.FullName }

          if (gh release view $env:RELEASE_TAG 2>$null) {
            gh release upload $env:RELEASE_TAG @files --clobber
            gh release edit $env:RELEASE_TAG --notes-file "release\RELEASE_NOTES.md"
          } else {
            gh release create $env:RELEASE_TAG @files --target $env:GITHUB_SHA --title "Subtitle Composer $env:RELEASE_TAG" --notes-file "release\RELEASE_NOTES.md"
          }
